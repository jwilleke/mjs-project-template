# Static security analysis of the kit's own code.
#
# This repo distributes executable files — bin/kit.mjs, utility/set-version.mjs,
# utility/sync-labels.sh, install-kit.sh — into twelve other repos. Those repos
# run CodeQL; this one did not. So a high-severity ReDoS in set-version.mjs was
# found by a consumer's scan, in a sync PR, after the file had already been
# fanned out. The source of a fix has to be scanned at least as well as its
# destinations.
#
# `regexp/no-super-linear-backtracking` in eslint.config.mjs catches that
# particular class at commit time, which is faster and cheaper. This is the
# backstop for everything eslint does not model.

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended over the default: the default query pack does not
          # include every ReDoS query, and ReDoS is the reason this file exists.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
